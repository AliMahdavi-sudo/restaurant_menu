<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافه فکتوری</title>
    <meta name="description" content="Avid Design">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="website">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --color-primary: #162d1e;
            --color-secondary: #af9468;
            --color-primary-light: #1f3d2a;
            --color-secondary-light: #c4a97d;
            --color-secondary-dark: #8f7a54;

            --gradient-primary: linear-gradient(135deg, #162d1e 0%, #af9468 100%);
            --gradient-primary-reverse: linear-gradient(135deg, #af9468 0%, #162d1e 100%);
            --gradient-subtle: linear-gradient(135deg, rgba(22, 45, 30, 0.05) 0%, rgba(175, 148, 104, 0.05) 100%);

            --color-bg: #f8f6f2;
            --color-surface: #ffffff;
            --color-text: #1a1a1a;
            --color-text-secondary: #4a4a4a;
            --color-text-muted: #888888;
            --color-border: #e8e4dc;
            --color-shadow: rgba(22, 45, 30, 0.12);

            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            --space-3xl: 64px;
            --space-4xl: 80px;

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-full: 9999px;

            --shadow-sm: 0 2px 8px rgba(22, 45, 30, 0.06);
            --shadow-md: 0 6px 24px rgba(22, 45, 30, 0.10);
            --shadow-lg: 0 12px 48px rgba(22, 45, 30, 0.14);
            --shadow-xl: 0 20px 64px rgba(22, 45, 30, 0.18);
            --shadow-hover: 0 16px 40px rgba(22, 45, 30, 0.16);

            --transition-fast: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-base: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-slow: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);

            --font-family: 'Vazirmatn', sans-serif;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-md: 18px;
            --font-size-lg: 22px;
            --font-size-xl: 28px;
            --font-size-2xl: 36px;
            --font-size-3xl: 44px;
            --font-size-4xl: 56px;

            --z-back: -1;
            --z-base: 1;
            --z-sticky: 100;
            --z-overlay: 200;
            --z-modal: 300;
            --z-tooltip: 400;
            --z-toast: 500;
        }

        /* ============================================================
           DARK MODE VARIABLES (پیش‌فرض حالت شب)
           ============================================================ */
        [data-theme="dark"] {
            --color-bg: #0f1a13;
            --color-surface: #1a2a1f;
            --color-text: #ece8e0;
            --color-text-secondary: #c4bdb0;
            --color-text-muted: #8a8278;
            --color-border: #2a3a2f;
            --color-shadow: rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 64px rgba(0, 0, 0, 0.6);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.5);
            --gradient-subtle: linear-gradient(135deg, rgba(22, 45, 30, 0.2) 0%, rgba(175, 148, 104, 0.1) 100%);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background-color var(--transition-base), color var(--transition-base);
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: var(--font-family);
            cursor: pointer;
            border: none;
            background: none;
            font-size: inherit;
            color: inherit;
        }

        ul,
        ol {
            list-style: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-secondary);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-secondary-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
        }

        .text-gradient {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: var(--space-sm);
            letter-spacing: -0.5px;
            transition: color var(--transition-base);
        }
        [data-theme="dark"] .section-title {
            color: var(--color-secondary-light);
        }

        .section-divider {
            width: 60px;
            height: 3px;
            background: var(--gradient-primary);
            border-radius: var(--radius-full);
            margin-bottom: var(--space-xl);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ============================================================
           LOADING ANIMATION
           ============================================================ */
        .loader-wrapper {
            position: fixed;
            inset: 0;
            z-index: var(--z-toast);
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           HEADER / HERO
           ============================================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--color-primary);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background: url('images/hero.jpg') center/cover no-repeat;
            opacity: 0.35;
            transition: opacity var(--transition-base);
        }
        [data-theme="dark"] .hero-bg {
            opacity: 0.25;
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(22, 45, 30, 0.85) 0%, rgba(175, 148, 104, 0.40) 100%);
        }

        .hero-content {
            position: relative;
            z-index: var(--z-base);
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
            max-width: 800px;
        }

        .hero-logo {
            width: 150px;
            height: 150px;
            margin: 0 auto var(--space-xl);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.10);
            transition: transform var(--transition-bounce), box-shadow var(--transition-base);
        }
        .hero-logo:hover {
            transform: scale(1.04);
            box-shadow: var(--shadow-lg);
        }
        .hero-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hero-name {
            font-size: clamp(var(--font-size-2xl), 6vw, var(--font-size-4xl));
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: var(--space-sm);
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .hero-name span {
            background: linear-gradient(135deg, #af9468 0%, #d4c09a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-scroll-indicator {
            position: absolute;
            bottom: var(--space-2xl);
            left: 50%;
            transform: translateX(-50%);
            z-index: var(--z-base);
            color: rgba(255, 255, 255, 0.5);
            font-size: var(--font-size-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-xs);
            animation: float-down 2s ease-in-out infinite;
        }
        .hero-scroll-indicator svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes float-down {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateX(-50%) translateY(8px);
                opacity: 1;
            }
        }

        /* ============================================================
           CATEGORY NAVIGATION (Sticky)
           ============================================================ */
        .category-nav {
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-md) 0;
            transition: background var(--transition-base), border-color var(--transition-base), box-shadow var(--transition-base);
            box-shadow: var(--shadow-sm);
        }
        [data-theme="dark"] .category-nav {
            background: var(--color-surface);
            border-color: var(--color-border);
        }

        .category-nav-scroll {
            display: flex;
            gap: var(--space-sm);
            overflow-x: auto;
            padding: var(--space-xs) var(--space-lg);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .category-nav-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-nav-btn {
            flex-shrink: 0;
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-secondary);
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            transition: all var(--transition-fast);
            scroll-snap-align: start;
            white-space: nowrap;
        }
        .category-nav-btn:hover {
            color: var(--color-primary);
            border-color: var(--color-secondary);
            background: var(--gradient-subtle);
        }
        .category-nav-btn.active {
            background: var(--gradient-primary);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(175, 148, 104, 0.35);
        }
        [data-theme="dark"] .category-nav-btn {
            background: var(--color-surface);
            border-color: var(--color-border);
            color: var(--color-text-secondary);
        }
        [data-theme="dark"] .category-nav-btn:hover {
            background: var(--color-primary-light);
            color: var(--color-secondary-light);
        }
        [data-theme="dark"] .category-nav-btn.active {
            background: var(--gradient-primary);
            color: #ffffff;
        }

        /* ============================================================
           MENU SECTIONS
           ============================================================ */
        .menu-section {
            padding: var(--space-3xl) 0;
            scroll-margin-top: 80px;
            transition: background var(--transition-base);
        }
        .menu-section:nth-child(even) {
            background: var(--gradient-subtle);
        }
        [data-theme="dark"] .menu-section:nth-child(even) {
            background: rgba(22, 45, 30, 0.20);
        }

        .menu-section-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: var(--space-2xl);
        }
        .menu-section-header .section-title {
            font-size: clamp(var(--font-size-xl), 3vw, var(--font-size-2xl));
        }

        /* ============================================================
           PRODUCT GRID
           ============================================================ */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-xl);
        }

        /* ============================================================
           PRODUCT CARD (فقط نمایشی)
           ============================================================ */
        .product-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
            border: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            opacity: 0;
            transform: translateY(24px);
            cursor: default;
            pointer-events: none;
            user-select: none;
        }
        .product-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--color-secondary);
        }
        [data-theme="dark"] .product-card {
            background: var(--color-surface);
            border-color: var(--color-border);
        }
        [data-theme="dark"] .product-card:hover {
            border-color: var(--color-secondary-light);
            box-shadow: var(--shadow-hover);
        }

        .product-image-wrapper {
            position: relative;
            padding-top: 75%;
            overflow: hidden;
            background: var(--color-bg);
            flex-shrink: 0;
            pointer-events: none;
        }
        .product-image-wrapper img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-slow);
        }
        .product-card:hover .product-image-wrapper img {
            transform: scale(1.05);
        }

        .product-image-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-subtle);
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
            font-weight: 400;
            pointer-events: none;
        }
        [data-theme="dark"] .product-image-placeholder {
            background: rgba(22, 45, 30, 0.3);
            color: var(--color-text-muted);
        }

        .product-body {
            padding: var(--space-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .product-name {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: var(--space-xs);
            transition: color var(--transition-base);
        }
        [data-theme="dark"] .product-name {
            color: var(--color-text);
        }

        .product-description {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            font-weight: 300;
            margin-bottom: var(--space-md);
            flex: 1;
            transition: color var(--transition-base);
        }
        [data-theme="dark"] .product-description {
            color: var(--color-text-secondary);
        }

        .product-price {
            font-size: var(--font-size-md);
            font-weight: 700;
            color: var(--color-secondary);
            margin-top: auto;
            transition: color var(--transition-base);
        }
        [data-theme="dark"] .product-price {
            color: var(--color-secondary-light);
        }

        .product-price-dual {
            display: flex;
            gap: var(--space-lg);
            margin-top: auto;
            flex-wrap: wrap;
        }
        .product-price-dual .price-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-secondary);
        }
        .product-price-dual .price-item .price-value {
            font-weight: 700;
            color: var(--color-secondary);
            font-size: var(--font-size-md);
        }
        [data-theme="dark"] .product-price-dual .price-item .price-value {
            color: var(--color-secondary-light);
        }
        .product-price-dual .price-item .price-label {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            font-weight: 400;
        }

        /* ============================================================
           BACK TO TOP
           ============================================================ */
        .back-to-top {
            position: fixed;
            bottom: var(--space-2xl);
            right: var(--space-2xl);
            z-index: var(--z-tooltip);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-primary);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-bounce);
            opacity: 0;
            visibility: hidden;
            transform: translateY(16px);
            font-size: 20px;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-to-top:hover {
            background: var(--gradient-primary);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        [data-theme="dark"] .back-to-top {
            background: var(--color-surface);
            border-color: var(--color-border);
            color: var(--color-secondary-light);
        }
        [data-theme="dark"] .back-to-top:hover {
            background: var(--gradient-primary);
            color: #ffffff;
        }

        /* ============================================================
           DARK MODE TOGGLE
           ============================================================ */
        .dark-toggle {
            position: fixed;
            top: var(--space-lg);
            right: var(--space-lg);
            z-index: var(--z-sticky);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all var(--transition-fast);
            backdrop-filter: blur(4px);
        }
        .dark-toggle:hover {
            transform: scale(1.06);
            border-color: var(--color-secondary);
        }
        [data-theme="dark"] .dark-toggle {
            background: var(--color-surface);
            border-color: var(--color-border);
            color: var(--color-text);
        }
        [data-theme="dark"] .dark-toggle:hover {
            border-color: var(--color-secondary-light);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .container {
                padding: 0 var(--space-md);
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: var(--space-lg);
            }
            .hero-logo {
                width: 130px;
                height: 130px;
            }
        }

        @media (max-width: 768px) {
            :root {
                --space-3xl: 40px;
                --space-4xl: 56px;
                --space-2xl: 32px;
            }

            .hero {
                min-height: 80vh;
            }
            .hero-logo {
                width: 100px;
                height: 100px;
                padding: 4px;
            }
            .hero-name {
                font-size: var(--font-size-2xl);
            }

            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: var(--space-md);
            }

            .category-nav {
                padding: var(--space-sm) 0;
            }
            .category-nav-btn {
                padding: var(--space-xs) var(--space-md);
                font-size: var(--font-size-xs);
            }

            .back-to-top {
                width: 44px;
                height: 44px;
                bottom: var(--space-xl);
                right: var(--space-xl);
                font-size: 18px;
            }

            .dark-toggle {
                top: var(--space-md);
                right: var(--space-md);
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .product-body {
                padding: var(--space-md);
            }
            .product-name {
                font-size: var(--font-size-sm);
            }
            .product-description {
                font-size: var(--font-size-xs);
            }
            .product-price {
                font-size: var(--font-size-sm);
            }
            .product-price-dual .price-item {
                font-size: var(--font-size-xs);
            }
            .product-price-dual .price-item .price-value {
                font-size: var(--font-size-sm);
            }

            .menu-section {
                padding: var(--space-2xl) 0;
                scroll-margin-top: 64px;
            }
            .menu-section-header .section-title {
                font-size: var(--font-size-xl);
            }

            .hero-scroll-indicator {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: var(--space-sm);
            }
            .product-body {
                padding: var(--space-sm);
            }
            .product-name {
                font-size: var(--font-size-xs);
            }
            .product-description {
                font-size: var(--font-size-xs);
                margin-bottom: var(--space-xs);
            }
            .product-price {
                font-size: var(--font-size-xs);
            }
            .product-price-dual .price-item {
                font-size: var(--font-size-xs);
            }
            .product-price-dual .price-item .price-value {
                font-size: var(--font-size-xs);
            }
            .category-nav-btn {
                padding: var(--space-xs) var(--space-sm);
                font-size: var(--font-size-xs);
            }
            .hero-logo {
                width: 80px;
                height: 80px;
                padding: 2px;
            }
            .hero-name {
                font-size: var(--font-size-xl);
            }

            // ============================================================
            // HELPERS
            // ============================================================
            function formatPrice(amount) {
                if (amount === 0 || amount === undefined || amount === null) return '-';
                return amount.toLocaleString('fa-IR');
            }

            // مسیر عکس با نام فارسی مستقیم در پوشه images
            function getImagePath(productName) {
                const base = 'images/';
                // تبدیل فاصله به خط‌تیره و پشتیبانی کامل از حروف فارسی
                const safeName = productName.trim().replace(/\s+/g, '-');
                return base + safeName + '.jpg';
            }

            // ============================================================
            // RENDER PRODUCTS
            // ============================================================
            function renderProducts() {
                const grids = document.querySelectorAll('.product-grid');

                grids.forEach(grid => {
                    const category = grid.dataset.category;
                    const items = menuData[category] || [];
                    grid.innerHTML = '';

                    items.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.style.transitionDelay = (index * 60) + 'ms';

                        const imgPath = getImagePath(item.name);

                        // Image wrapper (بالای سر هر آیتم)
                        const imgWrapper = document.createElement('div');
                        imgWrapper.className = 'product-image-wrapper';

                        const img = document.createElement('img');
                        img.src = imgPath;
                        img.alt = item.name;
                        img.loading = 'lazy';
                        img.onerror = function() {
                            this.style.display = 'none';
                            const placeholder = document.createElement('div');
                            placeholder.className = 'product-image-placeholder';
                            placeholder.textContent = '📷 ' + item.name;
                            this.parentNode.appendChild(placeholder);
                        };
                        imgWrapper.appendChild(img);
                        card.appendChild(imgWrapper);

                        // Body
                        const body = document.createElement('div');
                        body.className = 'product-body';

                        const nameEl = document.createElement('h3');
                        nameEl.className = 'product-name';
                        nameEl.textContent = item.name;
                        body.appendChild(nameEl);

                        if (item.description && item.description.trim() !== '') {
                            const descEl = document.createElement('p');
                            descEl.className = 'product-description';
                            descEl.textContent = item.description;
                            body.appendChild(descEl);
                        }

                        if (item.prices) {
                            const dual = document.createElement('div');
                            dual.className = 'product-price-dual';
                            for (const [label, value] of Object.entries(item.prices)) {
                                const itemEl = document.createElement('span');
                                itemEl.className = 'price-item';
                                itemEl.innerHTML =
                                    `<span class="price-label">${label}</span> <span class="price-value">${formatPrice(value)}</span>`;
                                dual.appendChild(itemEl);
                            }
                            body.appendChild(dual);
                        } else if (item.price !== undefined) {
                            const priceEl = document.createElement('div');
                            priceEl.className = 'product-price';
                            priceEl.textContent = formatPrice(item.price);
                            body.appendChild(priceEl);
                        } else {
                            const priceEl = document.createElement('div');
                            priceEl.className = 'product-price';
                            priceEl.textContent = '-';
                            body.appendChild(priceEl);
                        }

                        card.appendChild(body);
                        grid.appendChild(card);
                    });
                });
            }

            // ============================================================
            // INTERSECTION OBSERVER (Fade-in cards)
            // ============================================================
            function initIntersectionObserver() {
                const cards = document.querySelectorAll('.product-card');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -40px 0px'
                });
                cards.forEach(card => observer.observe(card));
            }

            // ============================================================
            // CATEGORY NAVIGATION (Scroll & Active highlight)
            // ============================================================
            function initCategoryNav() {
                const navBtns = document.querySelectorAll('.category-nav-btn');
                const sections = document.querySelectorAll('.menu-section');

                navBtns.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const target = this.dataset.target;
                        const section = document.getElementById(target);
                        if (section) {
                            const offset = 80;
                            const top = section.getBoundingClientRect().top + window.scrollY - offset;
                            window.scrollTo({ top, behavior: 'smooth' });
                        }
                        navBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                    });
                });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const id = entry.target.id;
                            navBtns.forEach(btn => {
                                btn.classList.remove('active');
                                if (btn.dataset.target === id) {
                                    btn.classList.add('active');
                                    btn.scrollIntoView({
                                        behavior: 'smooth',
                                        block: 'nearest',
                                        inline: 'center'
                                    });
                                }
                            });
                        }
                    });
                }, {
                    threshold: 0.35,
                    rootMargin: '0px 0px -40px 0px'
                });

                sections.forEach(section => observer.observe(section));
            }

            // ============================================================
            // BACK TO TOP
            // ============================================================
            function initBackToTop() {
                const btn = document.getElementById('backToTop');

                window.addEventListener('scroll', function() {
                    if (window.scrollY > 600) {
                        btn.classList.add('visible');
                    } else {
                        btn.classList.remove('visible');
                    }
                });

                btn.addEventListener('click', function() {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // ============================================================
            // DARK MODE (پیش‌فرض حالت شب)
            // ============================================================
            function initDarkMode() {
                const toggle = document.getElementById('darkToggle');
                const icon = document.getElementById('darkIcon');
                const stored = localStorage.getItem('theme');

                if (stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    icon.textContent = '☀️';
                } else if (stored === 'light') {
                    document.documentElement.removeAttribute('data-theme');
                    icon.textContent = '🌙';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    icon.textContent = '☀️';
                }

                toggle.addEventListener('click', function() {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    if (isDark) {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('theme', 'light');
                        icon.textContent = '🌙';
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                        icon.textContent = '☀️';
                    }
                });
            }

            // ============================================================
            // LOADING SCREEN
            // ============================================================
            function hideLoader() {
                const loader = document.getElementById('loaderWrapper');
                loader.classList.add('hidden');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 800);
            }

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                renderProducts();
                initCategoryNav();
                initBackToTop();
                initDarkMode();

                setTimeout(() => {
                    initIntersectionObserver();
                }, 100);

                setTimeout(hideLoader, 600);
            });

        })();
    </script>

</body>
</html>
